name: OWASP ZAP API Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Start Log Aggregator Server
        run: |
          go run ./cmd/aggregator &
          # Ждем, пока сервер поднимется и ответит на healthcheck
          for i in {1..30}; do
            if curl -s http://localhost:8080/healthz; then
              echo "Server is up and ready!"
              break
            fi
            sleep 1
          done

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'docs/openapi.yaml'
          format: openapi
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-O http://localhost:8080'

      - name: Upload Scan Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-scan-report
          path: |
            report_html.html
            report_json.json
            report_md.md
