<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Aggregator — Swagger UI & API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-dark: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #fafafa;
    }

    .top-nav {
      background: var(--bg-dark);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .nav-brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .nav-brand span {
      color: var(--accent);
    }

    .badge-swagger {
      font-size: 0.75rem;
      background: #0284c7;
      color: #fff;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: #fff;
    }

    .nav-btn {
      background: #334155;
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: #475569;
    }

    #swagger-ui {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 1.5rem 3rem;
    }

    .swagger-ui .topbar {
      display: none;
    }

    .swagger-ui .info {
      margin: 1.5rem 0;
    }

    .swagger-ui .info .title {
      font-size: 2rem;
      color: #0f172a;
    }
  </style>
</head>

<body>

  <header class="top-nav">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <a href="/" class="nav-brand">
        Log<span>Aggregator</span>
      </a>
      <span class="badge-swagger">OpenAPI 3.0</span>
    </div>

    <div class="nav-links">
      <a href="/" class="nav-link">← Дашборд</a>
      <a href="/docs/openapi.yaml" target="_blank" class="nav-btn">openapi.yaml</a>
      <a href="/docs/openapi.json" target="_blank" class="nav-btn">openapi.json</a>
    </div>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "/docs/openapi.yaml",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        docExpansion: "list",
        defaultModelsExpandDepth: 2,
        defaultModelExpandDepth: 2,
        displayRequestDuration: true,
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        tryItOutEnabled: true
      });
    };
  </script>
</body>

</html>
