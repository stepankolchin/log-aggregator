<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Aggregator — Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#263348;
  --border:#334155;--text:#e2e8f0;--muted:#94a3b8;
  --accent:#3b82f6;
  --debug:#64748b;--info:#22d3ee;--warn:#f59e0b;--error:#ef4444;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5}

/* ── HEADER ── */
header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10}
.logo{font-size:17px;font-weight:700;color:var(--accent);letter-spacing:-.3px}
.logo span{color:var(--text);font-weight:400}
.refresh-chip{display:flex;align-items:center;gap:7px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;
  animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── LAYOUT ── */
main{max-width:1440px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:20px}

/* ── STAT CARDS ── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.card-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.card-val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.c-ok   .card-val{color:#22c55e}
.c-drop .card-val{color:var(--warn)}
.c-err  .card-val{color:var(--error)}
.c-mem  .card-val{color:#a78bfa}
.c-up   .card-val{font-size:18px;color:var(--accent)}

/* ── BAR PANELS ── */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.panels{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.panel-title{font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.bar-key{min-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.bar-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.bar-cnt{min-width:36px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── FILTERS ── */
.filters{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:6px;font-size:13px;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--accent)}
input[type=text]{width:160px}
button{background:var(--accent);color:#fff;border:none;padding:7px 16px;
  border-radius:6px;font-size:13px;cursor:pointer;font-weight:500;transition:opacity .2s}
button:hover{opacity:.82}
button.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}

/* ── LOG TABLE ── */
.logs-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.logs-head{padding:12px 18px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center}
.logs-head strong{font-size:13px}
.logs-head small{font-size:12px;color:var(--muted)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
td{padding:8px 12px;border-bottom:1px solid rgba(51,65,85,.45);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.025)}
.ts{color:var(--muted);white-space:nowrap;font-family:monospace;font-size:12px}
.svc{font-weight:500;white-space:nowrap}
.msg{word-break:break-word;max-width:480px}
.fields{font-family:monospace;font-size:11px;color:var(--muted);margin-top:3px}
.tid{font-family:monospace;font-size:11px;color:var(--muted);white-space:nowrap}

/* ── LEVEL BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.lv-debug{background:rgba(100,116,139,.2);color:#94a3b8}
.lv-info {background:rgba(34,211,238,.15);color:#22d3ee}
.lv-warn {background:rgba(245,158,11,.18);color:#f59e0b}
.lv-error{background:rgba(239,68,68,.18);color:#ef4444}

.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header>
  <div class="logo">⚡ Log<span>Aggregator</span></div>
  <div class="refresh-chip">
    <div class="dot"></div>
    обновление через <strong id="cd" style="margin-left:3px;color:var(--text)">5</strong>с
  </div>
</header>

<main>

  <!-- Карточки -->
  <div class="stat-row">
    <div class="card c-ok">  <div class="card-label">&#x2714; Принято</div>   <div class="card-val" id="s-acc">—</div></div>
    <div class="card c-drop"><div class="card-label">&#x21BA; Отклонено</div> <div class="card-val" id="s-drp">—</div></div>
    <div class="card c-err"> <div class="card-label">&#x26A0; Ошибок (HTTP)</div>    <div class="card-val" id="s-err">—</div></div>
    <div class="card"style="border-color:#ef4444"><div class="card-label" style="color:#ef4444">&#128308; Error-логов</div><div class="card-val" id="s-errlvl" style="color:#ef4444">—</div></div>
    <div class="card c-mem"> <div class="card-label">&#x1F4BE; В памяти</div>  <div class="card-val" id="s-mem">—</div></div>
    <div class="card c-up">  <div class="card-label">&#x23F1; Uptime</div>    <div class="card-val" id="s-up">—</div></div>
  </div>

  <!-- Гистограммы -->
  <div class="panels">
    <div class="panel"><div class="panel-title">По сервисам</div><div id="by-svc"></div></div>
    <div class="panel"><div class="panel-title">По уровням</div> <div id="by-lvl"></div></div>
  </div>

  <!-- Фильтры -->
  <div class="filters">
    <div class="fg"><label>Сервис</label><input id="f-svc" type="text" placeholder="auth-service"></div>
    <div class="fg">
      <label>Уровень</label>
      <select id="f-lvl">
        <option value="">Все</option>
        <option value="debug">debug</option>
        <option value="info">info</option>
        <option value="warn">warn</option>
        <option value="error">error</option>
      </select>
    </div>
    <div class="fg"><label>Поиск</label><input id="f-q" type="text" placeholder="текст в message" style="width:200px"></div>
    <div class="fg">
      <label>Показать</label>
      <select id="f-n"><option value="50">50</option><option value="100" selected>100</option><option value="200">200</option><option value="500">500</option></select>
    </div>
    <button onclick="applyFilters()">Применить</button>
    <button class="sec" onclick="resetFilters()">Сбросить</button>
  </div>

  <!-- Таблица логов -->
  <div class="logs-wrap">
    <div class="logs-head">
      <strong>Последние логи</strong>
      <small id="log-cnt">загрузка...</small>
    </div>
    <div class="tscroll">
      <table>
        <thead>
          <tr>
            <th>Время</th><th>Сервис</th><th>Уровень</th><th>Сообщение</th><th>Trace ID</th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="5" class="empty">Загрузка...</td></tr></tbody>
      </table>
    </div>
  </div>

</main>

<script>
const TICK = 5;
let cd = TICK, timer;

const lvlColor = {debug:'#64748b',info:'#22d3ee',warn:'#f59e0b',error:'#ef4444'};
const svcColors = ['#3b82f6','#8b5cf6','#06b6d4','#10b981','#f97316','#ec4899'];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function fmtTs(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})
    +' '+d.toLocaleTimeString('ru-RU',{hour12:false})
    +'.'+String(d.getMilliseconds()).padStart(3,'0');
}

function badge(lvl){return `<span class="badge lv-${lvl}">${lvl}</span>`}

function renderBars(id,data,colorFn){
  const el=document.getElementById(id);
  if(!data||!Object.keys(data).length){el.innerHTML='<div style="color:var(--muted);font-size:13px">Нет данных</div>';return}
  const max=Math.max(...Object.values(data));
  const keys=Object.keys(data).sort((a,b)=>data[b]-data[a]);
  el.innerHTML=keys.map((k,i)=>{
    const pct=max>0?(data[k]/max*100).toFixed(1):0;
    const color=colorFn?colorFn(k,i):'#3b82f6';
    return `<div class="bar-row">
      <div class="bar-key" title="${esc(k)}">${esc(k)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="bar-cnt">${data[k]}</div>
    </div>`;
  }).join('');
}

async function fetchStats(){
  try{
    const d=await fetch('/api/v1/stats').then(r=>r.json());
    document.getElementById('s-acc').textContent=d.accepted??'—';
    document.getElementById('s-drp').textContent=d.dropped??'—';
    document.getElementById('s-err').textContent=d.errors??'—';
    document.getElementById('s-errlvl').textContent=d.by_level?.error??0;
    document.getElementById('s-mem').textContent=d.in_memory??'—';
    document.getElementById('s-up').textContent=d.uptime??'—';
    renderBars('by-svc',d.by_service,(k,i)=>svcColors[i%svcColors.length]);
    renderBars('by-lvl',d.by_level,(k)=>lvlColor[k]||'#3b82f6');
  }catch(e){console.error('stats',e)}
}

async function fetchLogs(){
  const p=new URLSearchParams({
    service:document.getElementById('f-svc').value,
    level:  document.getElementById('f-lvl').value,
    search: document.getElementById('f-q').value,
    limit:  document.getElementById('f-n').value,
  });
  [...p.keys()].forEach(k=>{if(!p.get(k))p.delete(k)});
  try{
    const logs=await fetch('/api/v1/logs?'+p).then(r=>r.json());
    document.getElementById('log-cnt').textContent=`записей: ${logs?.length??0}`;
    const tb=document.getElementById('tbody');
    if(!logs?.length){tb.innerHTML='<tr><td colspan="5" class="empty">Логов не найдено</td></tr>';return}
    tb.innerHTML=logs.map(e=>{
      const fields=e.fields&&Object.keys(e.fields).length
        ?`<div class="fields">${esc(JSON.stringify(e.fields))}</div>`:'';
      return `<tr>
        <td class="ts">${fmtTs(e.timestamp)}</td>
        <td class="svc">${esc(e.service)}</td>
        <td>${badge(e.level)}</td>
        <td class="msg">${esc(e.message)}${fields}</td>
        <td class="tid">${esc(e.trace_id||'')}</td>
      </tr>`;
    }).join('');
  }catch(e){console.error('logs',e)}
}

function applyFilters(){fetchLogs()}
function resetFilters(){
  ['f-svc','f-q'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-lvl').value='';
  document.getElementById('f-n').value='100';
  fetchLogs();
}

function startTimer(){
  clearInterval(timer);cd=TICK;
  timer=setInterval(()=>{
    document.getElementById('cd').textContent=--cd;
    if(cd<=0){fetchStats();fetchLogs();cd=TICK;}
  },1000);
}

fetchStats();fetchLogs();startTimer();
</script>
</body>
</html>
