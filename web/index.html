<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Aggregator — Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header>
    <div class="logo">Log<span>Aggregator</span></div>
    <div class="refresh-chip">
      <div class="dot"></div>
      обновление через <strong id="cd" style="margin-left:3px;color:var(--text)">5</strong>с
    </div>
  </header>

  <main>

    <!-- Карточки -->
    <div class="stat-row">
      <div class="card c-ok">
        <div class="card-label">&#x2714; Принято</div>
        <div class="card-val" id="s-acc">—</div>
      </div>
      <div class="card c-drop">
        <div class="card-label">&#x21BA; Отклонено</div>
        <div class="card-val" id="s-drp">—</div>
      </div>
      <div class="card c-err">
        <div class="card-label">&#x26A0; Ошибок (HTTP)</div>
        <div class="card-val" id="s-err">—</div>
      </div>
      <div class="card" style="border-color:#ef4444">
        <div class="card-label" style="color:#ef4444">&#128308; Error-логов</div>
        <div class="card-val" id="s-errlvl" style="color:#ef4444">—</div>
      </div>
      <div class="card c-mem">
        <div class="card-label">&#x1F4BE; В памяти</div>
        <div class="card-val" id="s-mem">—</div>
      </div>
      <div class="card c-up">
        <div class="card-label">&#x23F1; Uptime</div>
        <div class="card-val" id="s-up">—</div>
      </div>
    </div>

    <!-- Гистограммы -->
    <div class="panels">
      <div class="panel">
        <div class="panel-title">По сервисам</div>
        <div id="by-svc"></div>
      </div>
      <div class="panel">
        <div class="panel-title">По уровням</div>
        <div id="by-lvl"></div>
      </div>
    </div>

    <!-- Фильтры -->
    <div class="filters">
      <div class="fg">
        <label>Источник</label>
        <select id="f-src" onchange="onSourceChange()">
          <option value="memory" selected>Live</option>
          <option value="file">Архив</option>
        </select>
      </div>
      <div class="fg date-field" id="wrap-from" style="display:none">
        <label>С даты/времени</label>
        <input id="f-from" type="datetime-local">
      </div>
      <div class="fg date-field" id="wrap-to" style="display:none">
        <label>По дату/время</label>
        <input id="f-to" type="datetime-local">
      </div>
      <div class="fg"><label>Сервис</label><input id="f-svc" type="text" placeholder="auth-service"></div>
      <div class="fg">
        <label>Уровень</label>
        <select id="f-lvl">
          <option value="">Все</option>
          <option value="debug">debug</option>
          <option value="info">info</option>
          <option value="warn">warn</option>
          <option value="error">error</option>
        </select>
      </div>
      <div class="fg"><label>Поиск</label><input id="f-q" type="text" placeholder="текст в message" style="width:180px">
      </div>
      <div class="fg">
        <label>На стр.</label>
        <select id="f-n">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </div>
      <div class="btn-group">
        <button onclick="applyFilters()">Применить</button>
        <button class="sec" onclick="resetFilters()">Сбросить</button>
      </div>
    </div>

    <!-- Таблица логов -->
    <div class="logs-wrap">
      <div class="logs-head">
        <div>
          <strong id="logs-title">Последние логи</strong>
          <small id="log-cnt">загрузка...</small>
        </div>
        <div class="pagination">
          <button id="btn-prev" class="sec btn-sm" onclick="prevPage()" disabled>← Назад</button>
          <span id="page-num" class="page-label">Стр. 1</span>
          <button id="btn-next" class="sec btn-sm" onclick="nextPage()" disabled>Вперёд →</button>
        </div>
      </div>
      <div class="tscroll">
        <table>
          <thead>
            <tr>
              <th>Время</th>
              <th>Сервис</th>
              <th>Уровень</th>
              <th>Сообщение</th>
              <th>Trace ID</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <td colspan="5" class="empty">Загрузка...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="logs-foot">
        <div class="pagination">
          <button id="btn-prev-b" class="sec btn-sm" onclick="prevPage()" disabled>← Назад</button>
          <span id="page-num-b" class="page-label">Стр. 1</span>
          <button id="btn-next-b" class="sec btn-sm" onclick="nextPage()" disabled>Вперёд →</button>
        </div>
      </div>
    </div>

  </main>

  <script src="/app.js"></script>
</body>

</html>
